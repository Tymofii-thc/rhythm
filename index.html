<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<title>Ритм</title>
<style>
:root{--bg:#14161a;--card:#1d2026;--line:#2b2f37;--tx:#e8eaed;--mute:#8b919c;--ok:#4cc38a;--min:#e5b84c;--bad:#e5645c;--acc:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 90px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.p{background:var(--acc);color:#0b1020;border-color:var(--acc);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#101216;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:14px 0;color:var(--mute)}
.tabs button.on{color:var(--acc);font-weight:600}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.item input{width:26px;height:26px;margin-top:1px;accent-color:var(--ok);flex:none}
.item .t{font-weight:600}
.item .d{color:var(--mute);font-size:14px}
.item.done .t{color:var(--mute);text-decoration:line-through}
.warn{border-color:var(--bad);background:#2a1a1b}
.good{border-color:var(--ok);background:#14241d}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.big{font-size:28px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
textarea,input[type=text]{width:100%;background:#101216;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:78px;resize:vertical}
.sl{display:grid;grid-template-columns:90px 1fr 26px;gap:10px;align-items:center;margin:6px 0}
.sl input{width:100%;accent-color:var(--acc)}
.sw{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cell{border-radius:10px;padding:8px 0;border:1px solid var(--line);background:#101216;font-size:12px;color:var(--mute)}
.cell b{display:block;font-size:15px;color:var(--tx)}
.cell.full{background:#16301f;border-color:var(--ok)}
.cell.mn{background:#332b12;border-color:var(--min)}
.cell.today{outline:2px solid var(--acc)}
ul{margin:6px 0 0;padding-left:20px}
li{margin:3px 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tabs">
  <button data-tab="today" class="on">Сьогодні</button>
  <button data-tab="week">Тиждень</button>
  <button data-tab="rules">Правила</button>
  <button data-tab="data">Дані</button>
</div>

<script>
/* ======== ПЛАН (змінюй тут, раз на місяць, не частіше) ======== */
const PLAN = {
  wk: {
    name: "Будній день",
    items: [
      {id:"sleep", t:"Сон за графіком", d:"Відбій 00:00, підйом 07:00 (±30 хв)", core:1, min:1},
      {id:"nophone", t:"Перші 60 хв без телефона", d:"07:00–08:00. Вода, світло, рух. Телефон лежить далеко", core:1},
      {id:"move", t:"Рух", d:"Тренування: Пн 15:30–17:30 (руки), Ср одразу після пар (ноги), Пт зранку або після пар о 15:30. Інші дні: прогулянка 30+ хв", core:1, min:1},
      {id:"b1", t:"Блок №1: найважливіша задача", d:"Пн, Чт, Пт, Вт 08:00–10:00. Ср 10:00–12:00 між парами. Без сповіщень. Мінімум: 20 хв", core:1, min:1},
      {id:"b2", t:"Блок №2", d:"90 хв у вільне вікно: Вт і Пт 11:00–12:30, Чт 14:00–15:30. Пн і Ср за бажанням. Мінімум: пропустити без провини", core:1},
      {id:"plan", t:"Вечір: 3 головні задачі на завтра", d:"22:30, 10 хв, запиши нижче"},
      {id:"scr", t:"Година до сну без екранів", d:"23:00–00:00. Душ, книжка, світло приглушене"}
    ],
    avoid: ["Без кави після 15:00","Без ігор і відео до блоку №1","Без скролінгу між блоками (відпочинок = вода, прогулянка, розтяжка)","Не відкладав задачу №1 «на потім»"],
    rewards: ["Після блоку №1: 15 хв перерви + щось приємне (музика, кава, прогулянка)","Після обох блоків: ігри, фільми, друзі без почуття провини"]
  },
  sat: {
    name: "Субота (D&D)",
    items: [
      {id:"sleep", t:"Сон за графіком", d:"Підйом 07:00 ±30 хв, навіть після пізнього D&D", core:1, min:1},
      {id:"nophone", t:"Перші 60 хв без телефона", d:"07:00–08:00"},
      {id:"move", t:"Рух", d:"Прогулянка 30 хв або зарядка до 13:00", core:1, min:1},
      {id:"b1", t:"Один блок до виходу на D&D", d:"08:00–09:30, одна задача. Мінімум: 20 хв", core:1, min:1},
      {id:"scr", t:"Екрани вимкнені перед сном", d:"Навіть якщо D&D затягнувся, мінімум 30 хв без телефона"}
    ],
    avoid: ["Без кави після 15:00","Не брати «ще один блок» увечері, D&D це твоя нагорода"],
    rewards: ["Після блоку: до вечора і ночі D&D без жодної провини. Це частина плану, не порушення"]
  },
  sun: {
    name: "Неділя (огляд)",
    items: [
      {id:"sleep", t:"Сон за графіком", d:"Підйом 07:00, не зсувай більш ніж на 30 хв", core:1, min:1},
      {id:"move", t:"Рух", d:"Прогулянка 30+ хв, до обіду", core:1, min:1},
      {id:"review", t:"Огляд тижня (20 хв)", d:"Бл. 10:00. Подивись вкладку «Тиждень»: що вийшло, що ні, що змінити (одна річ)", core:1, min:1},
      {id:"weekplan", t:"План на наступний тиждень", d:"Бл. 18:00. Пари PJATK, Innowise, дедлайни, D&D. 3 головні цілі", core:1},
      {id:"b1", t:"Легкий блок (за бажанням)", d:"Бл. 11:00, одна задача 60 хв, або ні"}
    ],
    avoid: ["Без кави після 15:00"],
    rewards: ["Вільний вечір без плану нагород. Мінімум (сон, рух), решта твоє"]
  }
};
/* ============================================================ */

const KEY = "ryt-v1";
let S = load();
let tab = "today";
let cur = dk(new Date());

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.days) return s; }catch(e){}
  return {days:{}, start: dk(new Date()), sleepT:"", wakeT:""};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function pad(n){return String(n).padStart(2,"0")}
function dk(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromKey(k){return new Date(k+"T12:00:00")}
function shift(k,n){const d=fromKey(k); d.setDate(d.getDate()+n); return dk(d)}
function typeOf(k){const w=fromKey(k).getDay(); return w===0?"sun":w===6?"sat":"wk"}
function rec(k){ if(!S.days[k]) S.days[k]={checks:{},min:false,e:5,m:5,f:5,rated:false,note:"",tasks:""}; return S.days[k]; }
function status(k){ // 0 нічого, 1 мінімум виконано, 2 повний план
  const r=S.days[k]; if(!r) return 0;
  const items=PLAN[typeOf(k)].items;
  const full=items.filter(i=>i.core).every(i=>r.checks[i.id]);
  if(full) return 2;
  const mn=items.filter(i=>i.min).every(i=>r.checks[i.id]);
  return mn?1:0;
}
function streak(){
  const today=dk(new Date()); let k=today, n=0;
  if(!status(k)) k=shift(k,-1);
  while(status(k)>0 && k>=S.start){ n++; k=shift(k,-1); }
  return n;
}
const DAYS=["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const DAYSL=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const el=document.getElementById("app");
  el.innerHTML = tab==="today"?vToday():tab==="week"?vWeek():tab==="rules"?vRules():vData();
}

function vToday(){
  const t=typeOf(cur), P=PLAN[t], r=rec(cur), real=dk(new Date());
  const d=fromKey(cur);
  const items = r.min ? P.items.filter(i=>i.min) : P.items;
  const st=status(cur);
  const y=shift(real,-1);
  let h=`<div class="nav"><button data-a="prev">←</button><div style="text-align:center"><h1>${DAYSL[d.getDay()]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}</h1><span class="pill">${P.name}</span></div><button data-a="next" ${cur>=real?"disabled style='opacity:.3'":""}>→</button></div>`;
  h+=`<div class="card row between"><div><div class="big">${streak()} 🔥</div><div class="mute">днів поспіль</div></div>
      <label class="sw"><input type="checkbox" data-a="minmode" ${r.min?"checked":""} style="width:26px;height:26px;accent-color:var(--min)"><span><b>Мінімум-режим</b><br><span class="mute">поганий день: тільки найважливіше</span></span></label></div>`;
  if(cur===real && S.start<real && !status(y) && !status(real) && y>=S.start)
    h+=`<div class="card warn"><b>Вчора був пропуск.</b> Сьогодні не пропускай двічі. Увімкни мінімум-режим, якщо важко: 20 хв роботи, 10 хв руху, сон.</div>`;
  if(st===2) h+=`<div class="card good"><b>Повний план виконано ✅</b></div>`;
  else if(st===1) h+=`<div class="card good"><b>Мінімум виконано ✅</b> Серія збережена.</div>`;
  if(S.sleepT||S.wakeT) h+=`<div class="mute" style="margin:6px 2px">Мій графік: відбій ${esc(S.sleepT||"?")}, підйом ${esc(S.wakeT||"?")}</div>`;
  h+=`<h2>Що зробити</h2>`;
  items.forEach(i=>{
    const on=!!r.checks[i.id];
    h+=`<label class="card item ${on?"done":""}"><input type="checkbox" data-c="${i.id}" ${on?"checked":""}><div><div class="t">${i.t}${i.min&&!r.min?"":""}</div>${i.d?`<div class="d">${i.d}</div>`:""}</div></label>`;
  });
  if(!r.min){
    h+=`<h2>Чого не робив (відміть, якщо дотримався)</h2>`;
    P.avoid.forEach((a,idx)=>{const id="av"+idx;const on=!!r.checks[id];
      h+=`<label class="card item ${on?"done":""}" style="padding:9px 14px"><input type="checkbox" data-c="${id}" ${on?"checked":""} style="width:22px;height:22px"><div class="d" style="color:var(--tx)">${a}</div></label>`;});
  }
  h+=`<h2>Нагороди (заслужені)</h2><div class="card"><ul>${P.rewards.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(t==="wk"||t==="sun"){
    h+=`<h2>${t==="sun"?"3 головні цілі на тиждень":"3 головні задачі на завтра"}</h2><textarea data-a="tasks" placeholder="1.\n2.\n3.">${esc(r.tasks)}</textarea>`;
  }
  h+=`<h2>Самопочуття (1–10, для експерименту)</h2><div class="card">
    ${sl("e","Енергія",r.e)}${sl("m","Настрій",r.m)}${sl("f","Фокус",r.f)}
    <div class="mute">Рухай повзунки, щоб зберегти оцінку за сьогодні.</div></div>`;
  h+=`<h2>Нотатка</h2><textarea data-a="note" placeholder="Що завадило? Що допомогло?">${esc(r.note)}</textarea>`;
  return h;
}
function sl(k,n,v){return `<div class="sl"><span>${n}</span><input type="range" min="1" max="10" value="${v}" data-s="${k}"><b id="v-${k}">${v}</b></div>`}

function weekStart(k){const d=fromKey(k); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return dk(d)}
function vWeek(){
  const real=dk(new Date()); const ws=weekStart(real);
  let h=`<h1>Цей тиждень</h1><div class="grid" style="margin-top:12px">`;
  let full=0,mn=0,E=[],M=[],F=[];
  for(let i=0;i<7;i++){
    const k=shift(ws,i), st=status(k), d=fromKey(k), r=S.days[k];
    if(st===2)full++; if(st===1)mn++;
    if(r&&r.rated){E.push(r.e);M.push(r.m);F.push(r.f);}
    h+=`<div class="cell ${st===2?"full":st===1?"mn":""} ${k===real?"today":""}"><b>${DAYS[d.getDay()]}</b>${st===2?"✓":st===1?"мін":"·"}</div>`;
  }
  h+=`</div>`;
  const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"–";
  h+=`<div class="card" style="margin-top:14px"><div>Повний план: <b>${full}</b> · Тільки мінімум: <b>${mn}</b></div>
  <div class="mute" style="margin-top:6px">Середнє за тиждень: енергія ${avg(E)} · настрій ${avg(M)} · фокус ${avg(F)}</div></div>`;
  // попередні 4 тижні
  h+=`<h2>Попередні тижні</h2>`;
  for(let w=1;w<=4;w++){
    const s=shift(ws,-7*w); let f=0,m=0,e=[],mo=[],fo=[];
    for(let i=0;i<7;i++){const k=shift(s,i);const st=status(k);if(st===2)f++;if(st===1)m++;const r=S.days[k];if(r&&r.rated){e.push(r.e);mo.push(r.m);fo.push(r.f);}}
    h+=`<div class="card row between"><span>${s.slice(5).split("-").reverse().join(".")}</span><span class="mute">повний ${f} · мін ${m} · ⚡${avg(e)} 🙂${avg(mo)} 🎯${avg(fo)}</span></div>`;
  }
  h+=`<div class="card mute">Неділя: подивись, де найчастіше ламається, і зміни <b>одну</b> річ. Не більше.</div>`;
  return h;
}

function vRules(){
  return `<h1>Правила експерименту</h1>
  <div class="card"><ol style="padding-left:20px;margin:0">
  <li><b>Мінімальна версія.</b> У поганий день: 20 хв роботи, 10 хв руху, сон. Серія важливіша за ідеальність.</li>
  <li><b>Ніколи не пропускай двічі поспіль.</b></li>
  <li><b>4 тижні без змін плану.</b> Потім правка однієї речі за раз.</li>
  <li><b>Раз на тиждень огляд</b> (неділя): цифри, а не відчуття.</li>
  <li><b>Субота = D&D.</b> Це заплановано, не порушення.</li>
  </ol></div>
  <h2>Мій графік сну</h2>
  <div class="card"><div class="sl" style="grid-template-columns:80px 1fr"><span>Відбій</span><input type="text" data-a="sleepT" value="${esc(S.sleepT)}" placeholder="напр. 23:30"></div>
  <div class="sl" style="grid-template-columns:80px 1fr"><span>Підйом</span><input type="text" data-a="wakeT" value="${esc(S.wakeT)}" placeholder="напр. 07:30"></div></div>
  <h2>Як поставити на телефон</h2>
  <div class="card mute">iPhone (Safari): Поділитись → «На екран Додому».<br>Android (Chrome): ⋮ → «Додати на головний екран».</div>`;
}

function vData(){
  const n=Object.keys(S.days).length;
  return `<h1>Дані</h1>
  <div class="card">Усе зберігається <b>тільки в цьому браузері на цьому пристрої</b>. Якщо очистиш дані сайту або зміниш телефон, усе зникне. Роби експорт раз на тиждень (наприклад у неділю).<div class="mute" style="margin-top:8px">Днів у записах: ${n}. Старт: ${S.start}</div></div>
  <div class="card row" style="flex-wrap:wrap"><button class="p" data-a="export">Експорт (файл)</button>
  <label><button data-a="pick" type="button">Імпорт</button><input type="file" id="imp" accept=".json" class="hidden"></label></div>
  <div class="card"><button data-a="reset" style="color:var(--bad)">Стерти все</button></div>`;
}

document.addEventListener("click",e=>{
  const tb=e.target.closest(".tabs button"); if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return;}
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const a=b.dataset.a, real=dk(new Date());
  if(a==="prev"){cur=shift(cur,-1);render();}
  else if(a==="next"){ if(cur<real){cur=shift(cur,1);render();} }
  else if(a==="export"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const u=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=u; l.download="rhythm-"+real+".json"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  else if(a==="pick"){document.getElementById("imp").click();}
  else if(a==="reset"){ if(confirm("Точно стерти всі дані?")&&confirm("Це незворотно. Стерти?")){S={days:{},start:real,sleepT:"",wakeT:""};save();render();} }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.c){rec(cur).checks[t.dataset.c]=t.checked;save();render();}
  else if(t.dataset.a==="minmode"){rec(cur).min=t.checked;save();render();}
  else if(t.id==="imp"){
    const f=t.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result); if(!o.days) throw 0; S=o; save(); render(); alert("Імпортовано");}catch(x){alert("Файл не підходить");}};
    rd.readAsText(f);
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.s){const r=rec(cur);r[t.dataset.s]=+t.value;r.rated=true;document.getElementById("v-"+t.dataset.s).textContent=t.value;save();}
  else if(t.dataset.a==="note"){rec(cur).note=t.value;save();}
  else if(t.dataset.a==="tasks"){rec(cur).tasks=t.value;save();}
  else if(t.dataset.a==="sleepT"){S.sleepT=t.value;save();}
  else if(t.dataset.a==="wakeT"){S.wakeT=t.value;save();}
});
render();
</script>
</body>
</html>
